  <script src="https://pl31023140.profitableratecpmnetwork.com/09/af/e0/09afe0a51b4e53a39e342cc455c8cacf.js"></script>
  <script>
    (function () {
      var SMARTLINK = 'https://www.profitableratecpmnetwork.com/gb8ntr0un?key=c91886bad684fdac18b02ee4ff514237';
      var SESSION_KEY = 'smartlink_fired';
      var alreadyFired = false;
      try {
        alreadyFired = sessionStorage.getItem(SESSION_KEY) === '1';
      } catch (e) {}
      if (alreadyFired) return;
      document.addEventListener(
        'click',
        function () {
          try {
            sessionStorage.setItem(SESSION_KEY, '1');
          } catch (e) {}
          window.open(SMARTLINK, '_blank', 'noopener');
        },
        { once: true }
      );
    })();
  </script>
